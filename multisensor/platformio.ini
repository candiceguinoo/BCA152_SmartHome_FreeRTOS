[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM4

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.flash_mode = qio

board_build.embed_txtfiles =
    ../external/esp-rainmaker/components/esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    ../external/esp-rainmaker/components/esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    ../external/esp-rainmaker/components/esp_rainmaker/server_certs/rmaker_ota_server.crt
    managed_components/espressif__esp_insights/server_certs/mqtt_server.crt
    managed_components/espressif__esp_insights/server_certs/https_server.crt

check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr
check_skip_packages = yes

[env:native]
platform = native
test_framework = unity
build_flags = -Isrc -Iinclude
test_build_src = yes
build_src_filter = +<state_machine.c> +<light_map.c>



